<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/images/hero.jpg">

  <link rel="icon" type="image/png" href="/assets/images/deli-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
<a class="brand" href="/">
  <img src="/assets/images/deli-logo.png" alt="DELI logo" class="logo">
</a>

      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/portfolio/">Portfolio</a>
        <a href="/blog/">Journal</a>
        <a href="/about/">About</a>
        <a href="/contact/" class="btn btn-sm">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h3>{{ site.title }}</h3>
        <p>{{ site.description }}</p>
      </div>
      <div>
        <h4>Pages</h4>
        <ul>
          <li><a href="/portfolio/">Portfolio</a></li>
          <li><a href="/blog/">Journal</a></li>
          <li><a href="/about/">About</a></li>
          <li><a href="/contact/">Contact</a></li>
        </ul>
      </div>
      <div>
        <h4>Contact</h4>
        <p>Sarajevo, Bosnia and Herzegovina</p>
        <p><a href="mailto:info@deli.ba">info@deli.ba</a></p>
      </div>
    </div>
    <div class="container footer-bottom">
      <p>© {{ site.time | date: "%Y" }} DELI Design Studio & Consulting</p>
    </div>
  </footer>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.site-nav');

    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        const open = nav.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
  </script>
</body>
</html>
