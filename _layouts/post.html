---
layout: default
---
<section class="page-hero page-hero-sm">
  <div class="container narrow">
    <p class="eyebrow">Journal</p>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %d, %Y" }}</p>
    {% if page.description %}
      <p class="lead">{{ page.description }}</p>
    {% endif %}
  </div>
</section>

<article class="container narrow article-content">
  {{ content }}
</article>
